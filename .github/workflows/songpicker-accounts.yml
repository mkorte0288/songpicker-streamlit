name: Songpicker accounts
on:
  pull_request:
    paths:
      - 'bandapp/**'
      - 'auswahl.py'
      - 'manage.py'
      - 'requirements-app.txt'
      - '.github/workflows/songpicker-accounts.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: songpicker
          POSTGRES_PASSWORD: local-ci
          POSTGRES_DB: songpicker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songpicker -d songpicker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SONGPICKER_DEV: '1'
      DATABASE_URL: postgresql://songpicker:local-ci@localhost:5432/songpicker
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: pip install -r requirements-app.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test bandapp
