{% extends 'base.html' %}
{% block content %}
<section class="panel narrow"><h1>Neues Passwort setzen</h1>
{% if form %}<form method="post">{% csrf_token %}{{ form.as_p }}<button>Weiter</button></form>
{% else %}<p>Der Link ist ungültig oder abgelaufen. <a href="{% url 'password_reset' %}">Neuen Link anfordern</a></p>{% endif %}
</section>
{% endblock %}
