{% extends 'base.html' %}
{% block content %}
<section class="panel narrow"><h1>{{ title }}</h1>
{% if detail %}<p>{{ detail }}</p>{% endif %}
<form method="post">{% csrf_token %}
{% if action == 'Konto bestätigen' %}<label>Dein bei der Registrierung gewähltes Passwort <input name="password" type="password" autocomplete="current-password" required></label>{% endif %}
<button>{{ action }}</button></form></section>
{% endblock %}
